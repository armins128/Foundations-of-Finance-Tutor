<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">Foundations of Finance Tutor</title>
<desc id="desc">WHU Otto Beisheim School of Management, Chair of Finance. A practice sheet on squared paper: a cash-flow timeline for a coffee cart, the student's NPV of -9.9010 in an answer box, and the tutor's margin note asking a true-or-false follow-up instead of giving the next answer.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M20 0H0V20" fill="none" stroke="#D9E1E4" stroke-width="1"/>
  </pattern>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E2A33" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="1440" height="680" fill="#F3F2EE"/>
<image x="80" y="72" width="199" height="66" href="data:image/png;base64,"/>
<path d="M304 78V132" stroke="#054696" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="324" y="113" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#054696">Chair of Finance</text>

<g font-family="Georgia, 'Times New Roman', serif" fill="#1E2A33">
  <text x="80" y="256" font-size="64">Foundations</text>
  <text x="80" y="328" font-size="64">of Finance Tutor</text>
</g>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="80" y="388" font-size="21" fill="#46535C">A ChatGPT plugin for the WHU course that asks</text>
  <text x="80" y="418" font-size="21" fill="#46535C">you the next question instead of handing you</text>
  <text x="80" y="448" font-size="21" fill="#46535C">the next answer</text>
  <text x="80" y="516" font-size="16" fill="#76818A">14 skills  ·  7 course areas  ·  73 competencies</text>
</g>

<g transform="rotate(-1.2 1000 340)" filter="url(#lift)">
  <rect x="700" y="72" width="600" height="540" rx="4" fill="#FCFBF8"/>
  <rect x="700" y="72" width="600" height="540" rx="4" fill="url(#grid)"/>
  <path d="M760 72V612" stroke="#E7B9B0" stroke-width="1.5"/>

  <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#76818A">
    <text x="780" y="112">Practice · Value · new task</text>
    <text x="1210" y="112">4 pts</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#1E2A33">
    <text x="780" y="152">Ben wants to run a coffee cart on the Burgplatz.</text>
    <text x="780" y="178">It costs €400 today and earns €120, €150 and</text>
    <text x="780" y="204">€180 over three years. The rate is 7%.</text>
    <text x="780" y="230">Calculate the NPV, rounded to 4 decimals.</text>
  </g>

  <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#1E2A33" text-anchor="middle">
    <path d="M800 320H1240" stroke="#1E2A33" stroke-width="1.5"/>
    <path d="M820 312V328M960 312V328M1100 312V328M1240 312V328" stroke="#1E2A33" stroke-width="1.5"/>
    <text x="820" y="296">−400</text><text x="960" y="296">120</text><text x="1100" y="296">150</text><text x="1240" y="296">180</text>
    <g fill="#76818A" font-size="13"><text x="820" y="350">t = 0</text><text x="960" y="350">1</text><text x="1100" y="350">2</text><text x="1240" y="350">3</text></g>
  </g>

  <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="15" fill="#46535C">
    <text x="780" y="404">−400 + 120/1.07 + 150/1.07² + 180/1.07³</text>
  </g>
  <text x="780" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#46535C">NPV =</text>
  <rect x="836" y="426" width="132" height="38" rx="2" fill="#FCFBF8" stroke="#1E2A33" stroke-width="1.5"/>
  <text x="902" y="452" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17" fill="#1E2A33" text-anchor="middle">−9.9010</text>
  <path d="M984 446l7 7 13-15" fill="none" stroke="#2F6B4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A8382A">
    <path d="M780 500V556" stroke="#A8382A" stroke-width="2"/>
    <text x="796" y="514">Right, and the sign tells Ben to skip it.</text>
    <text x="796" y="538">True or false: the IRR of the cart</text>
    <text x="796" y="562">is below 7%.</text>
  </g>
  <text x="1280" y="592" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#9AA3AA" text-anchor="end">logged · V02 independent</text>
</g>
</svg>
